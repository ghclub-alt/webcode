function topic(l,title,i){const special={
python:[['name = "민지"\nage = 20\nprint(name, age)','변수는 값에 붙인 이름입니다. 문자열은 str, 정수는 int, 소수는 float입니다. input()은 문자열을 반환하므로 계산하려면 int()로 변환하세요.','20', 'age = 20\nprint(age)'],['for n in range(1, 4):\n    print(n)','if는 조건이 참일 때 블록을 실행합니다. for는 반복 가능한 값을 순회하고 range(1, 4)는 1, 2, 3을 만듭니다. 블록은 공백 네 칸으로 들여씁니다.','1\n2\n3','for n in range(1, 4):\n    print(n)'],['def add(a, b):\n    return a + b\n\na = int(input())\nb = int(input())\nprint(add(a, b))','함수는 입력을 받아 결과를 return으로 돌려줍니다. 리스트는 순서를, 딕셔너리는 키와 값의 대응을 저장합니다. 지역 변수는 함수 밖에서 직접 사용할 수 없습니다.',null,null],['try:\n    number = int("12")\n    print(number)\nexcept ValueError:\n    print("숫자를 입력하세요")','with open(...) as f는 블록 종료 시 파일을 닫습니다. 브라우저 Python의 파일은 가상 파일시스템에 저장됩니다. ValueError는 잘못된 값 변환을 뜻하며 필요한 예외만 처리하세요.','12',null],['class Counter:\n    def __init__(self):\n        self.value = 0\n    def increase(self):\n        self.value += 1\nc = Counter()\nc.increase()\nprint(c.value)','클래스는 데이터와 행동을 묶습니다. self는 현재 인스턴스입니다. 배열 전체 순회는 O(n), 정렬은 보통 O(n log n)입니다. 입력 크기와 연산 횟수를 함께 생각하세요.','1',null],['a = int(input())\nb = int(input())\nprint(a + b)','계산기 프로젝트: ① 두 정수 입력 ② 정수 변환 ③ 덧셈 함수 분리 ④ 결과 출력 ⑤ 음수와 0 테스트. 확장: 연산자 선택, 0으로 나누기 처리, CSV 데이터 집계.',null,null]],
c:[['#include <stdio.h>\nint main(void) {\n    int age = 20;\n    printf("%d\\n", age);\n    return 0;\n}','int는 정수, double은 실수, char는 문자입니다. printf의 %d는 int에 대응합니다. scanf("%d", &n)은 n의 주소에 입력을 저장합니다. 반환값을 검사해 입력 성공 여부를 확인하세요.','20',null],['#include <stdio.h>\nint main(void) {\n    for (int i = 1; i <= 3; i++) {\n        printf("%d\\n", i);\n    }\n    return 0;\n}','for는 초기식, 조건식, 증감식으로 구성됩니다. ==는 비교, =는 대입입니다. 반복 조건의 경계를 먼저 확인하면 한 번 더 반복하는 오류를 줄일 수 있습니다.','1\n2\n3',null],['#include <stdio.h>\nint main(void) {\n    int values[] = {2, 4, 6};\n    printf("%d\\n", values[1]);\n    return 0;\n}','배열은 같은 타입을 연속 저장하며 인덱스는 0부터 시작합니다. char 문자열은 끝에 널 문자 \\0가 필요합니다. 길이 3 배열의 유효 인덱스는 0~2이며 범위 밖 접근은 정의되지 않은 동작입니다.','4',null],['#include <stdio.h>\nint add(int a, int b) { return a + b; }\nint main(void) {\n    int a, b;\n    if (scanf("%d%d", &a, &b) != 2) return 1;\n    printf("%d\\n", add(a, b));\n    return 0;\n}','포인터는 메모리 주소를 저장합니다. &는 주소, *는 역참조 연산자입니다. 함수 인자는 기본적으로 값 복사입니다. 원본을 바꾸려면 유효한 주소를 전달하며 초기화되지 않은 포인터는 역참조하지 마세요.',null,null],['#include <stdio.h>\n#include <stdlib.h>\nint main(void) {\n    int *p = malloc(3 * sizeof *p);\n    if (!p) return 1;\n    p[0] = 7;\n    printf("%d\\n", p[0]);\n    free(p);\n    return 0;\n}','malloc은 힙 메모리를 할당합니다. NULL 검사 후 사용하고 free를 정확히 한 번 호출합니다. free 후 접근과 이중 해제는 잘못된 동작입니다. 연결 리스트는 노드와 다음 노드 포인터로 구성됩니다.','7',null],['#include <stdio.h>\nint main(void) {\n    int a, b;\n    if (scanf("%d%d", &a, &b) != 2) return 1;\n    printf("%d\\n", a + b);\n    return 0;\n}','성적 관리 프로젝트: ① 구조체로 이름과 점수 표현 ② 배열에 학생 저장 ③ 평균 계산 함수 ④ 점수 범위 검증 ⑤ 파일 저장과 오류 처리. 먼저 두 정수 합 계산을 완성하고 평균과 정렬로 확장하세요.',null,null]]};
const x=special[l.id]?.[i], isSum=(l.id==='python'&&(i===2||i===5))||(l.id==='c'&&(i===3||i===5));return {title,level:Math.min(i+1,5),body:x?.[1]||`${title} 단원입니다. ${l.intro} 아래 예제를 실행한 뒤 출력 문자열을 바꾸어 실행 결과가 어떻게 달라지는지 확인하세요. ${l.id==='html'?'제목, 문단, 링크를 적절히 배치하고 문서의 의미를 살펴보세요.':l.id==='css'?'박스의 여백, 색상, 배치를 바꾸고 미리보기에서 결과를 확인하세요.':'작은 예제에서 시작하여 입력, 처리, 출력 단계를 분리하는 것이 디버깅의 출발점입니다.'}`,syntax:x?.[0]||l.code,task:isSum?'두 정수를 한 줄씩 입력받아 합계를 출력하세요.':x?.[2]?`출력 결과가 다음과 같도록 작성하세요: ${x[2]}`:'예제를 실행하고 결과를 확인한 뒤 나만의 코드로 수정하세요.',expected:x?.[2]??(l.id==='html'||l.id==='css'?null:isSum?null:'Hello, CodeMaster!'),sum:isSum,hint:isSum?'입력 두 개를 정수로 변환하고 더한 결과만 출력하세요.':l.intro};}
function navigate(p){stop();page=p;free=p==='lab';activeFile=null;render()}
const menus=[['home','⌂','홈'],['languages','▦','언어 선택'],['learning','▤','내 학습'],['lab','⌘','코딩 실습실'],['problems','✓','문제 풀이'],['projects','◇','프로젝트'],['stats','▥','학습 통계'],['settings','⚙','설정']];
function render(){save();$('#nav').innerHTML='<span class="label">학습 공간</span>'+menus.map(([id,icon,t])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${icon}　${t}</button>`).join('')+'<div class="local">● 로컬 저장 모드<br>학습 기록은 이 브라우저에<br>안전하게 보관됩니다.</div>';const main=$('#main');if(page==='home')home();else if(['learning','lab'].includes(page))workspace();else if(page==='languages')catalog();else if(page==='stats')stats();else if(page==='settings')settings();else if(page==='problems')problems();else if(page==='projects')projects();main.insertAdjacentHTML('beforeend','<footer>CodeMaster · 작은 성취가 모여, 큰 가능성이 됩니다.</footer>')}
function start(id,n=0){state.language=id;state.lesson=n;page='learning';free=false;activeFile=null;render()}
function course(l){let n=state.done.filter(k=>k.startsWith(l.id+':')).length;return `<article class="card course"><div class="row between"><div class="icon">${esc(l.icon)}</div><span class="badge">${['python','javascript','html','css'].includes(l.id)?'추천 과정':'학습 과정'}</span></div><h3>${l.name}</h3><p>${l.desc}</p><div class="row between tiny"><span>6단계 · ${lessons(l).length}개 강의</span><span>${n}/${lessons(l).length} 완료</span></div><progress value="${n}" max="${lessons(l).length}"></progress><button onclick="start('${l.id}')">학습 시작하기 →</button></article>`}
function home(){$('#main').innerHTML=`<div class="row between"><div><div class="eyebrow">나의 학습 공간</div><h1>오늘도 한 걸음, 개발자에 가까이 👋</h1><p class="sub">배우고, 직접 만들고, 나의 가능성을 넓혀보세요.</p></div><span class="badge">나만의 학습 여정</span></div><section class="hero"><div><div class="eyebrow">한 줄씩, 더 나은 내일로</div><h2>코딩의 시작부터 실전까지,<br>함께 쌓아가는 나의 실력.</h2><p class="sub">${lang().name} · ${esc(lessons(lang())[state.lesson]?.title||'첫 번째 출력')}에서 이어서 시작해요.</p><button class="primary" onclick="start(state.language,state.lesson)">이어서 학습하기　→</button></div><div class="hero-art">&lt;/&gt;</div></section><div class="grid"><div class="card"><span class="tiny">완료한 강의</span><div class="stat">${state.done.length}<small class="tiny"> 개</small></div><span class="tiny">매일 하나씩 쌓는 성취</span></div><div class="card"><span class="tiny">누적 학습 시간</span><div class="stat">${Math.floor(state.seconds/60)}<small class="tiny"> 분</small></div><span class="tiny">오늘의 목표 ${state.goal}분</span></div><div class="card"><span class="tiny">문제 풀이 정확도</span><div class="stat">${accuracy()}<small class="tiny"> %</small></div><span class="tiny">${state.attempts.length}회 제출 · ${state.attempts.filter(a=>a.ok).length}회 통과</span></div></div><div class="row between section"><h2>어떤 언어로 시작할까요?</h2><button onclick="navigate('languages')">전체 과정 보기 →</button></div><div class="grid">${languages.slice(0,3).map(course).join('')}</div><div class="card section row between"><div><span class="badge">오늘의 추천</span><h3 style="margin:10px 0 0">직접 실행해 보면, 더 오래 기억돼요.</h3><span class="tiny">설치 없이 JavaScript 코드를 작성하고 결과를 확인해 보세요.</span></div><button onclick="state.language='javascript';navigate('lab')">실습실 열기 →</button></div>`}
function catalog(){$('#main').innerHTML='<h1>언어 선택</h1><p class="sub">12개의 언어와 기술, 나에게 맞는 출발점을 찾아보세요.</p><div class="grid">'+languages.map(course).join('')+'</div>'}
function accuracy(){return state.attempts.length?Math.round(state.attempts.filter(a=>a.ok).length/state.attempts.length*100):0}
function workspace(){const l=lang(),list=lessons(l),t=list[state.lesson]||list[0];$('#main').innerHTML=`<div class="row between" style="margin-bottom:20px"><div><div class="eyebrow">${free?'자유 실습':'직접 만들며 배우기'}</div><h1>${free?'코딩 실습실':l.name+' 학습하기'}</h1></div><select id="language" aria-label="실습 언어">${languages.map(x=>`<option value="${x.id}" ${l.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="learn"><aside class="card outline"><h3>${free?'작업 파일':'학습 목차'}</h3>${free?'<div id="filelist"></div><button onclick="newFile()">＋ 새 파일</button>':list.map((x,i)=>`<button class="${i===state.lesson?'selected':''}" onclick="start('${l.id}',${i})"><span class="tiny">LEVEL ${x.level+1} · ${levels[x.level]}</span><br>${state.done.includes(l.id+':'+i)?'✓ ':''}${esc(x.title)}</button>`).join('')}</aside><article class="card lesson">${free?`<span class="badge">자유롭게 만들기</span><h2 style="margin-top:20px">아이디어를 코드로.</h2><p>${l.intro}</p><p class="note">${runtimeNote(l)}</p><h3>입력과 실행</h3><p>표준 입력은 편집기 아래에 작성하세요. JavaScript에서는 input()으로 한 줄씩 읽습니다. 실행 시간은 최대 10초입니다.</p><h3>파일 보관</h3><p>새 파일을 만들고 이름을 지정하면 파일별 코드가 자동 저장됩니다. 파일은 각각 독립적으로 실행합니다.</p>`:`<span class="badge">LEVEL ${t.level+1} · ${levels[t.level]}</span><h2 style="margin-top:16px">${esc(t.title)}</h2><p>${esc(t.body)}</p><h3>이렇게 생각해 보세요</h3><p>${l.id==='c'?'메모리는 번호가 붙은 사물함입니다. 변수는 물건, 포인터는 사물함의 위치를 적은 메모입니다.':l.id==='python'?'변수는 이름표, 함수는 입력한 재료로 결과를 만드는 작은 작업실입니다.':esc(l.name)+'의 예제를 입력 → 처리 → 결과의 순서로 나누어 읽어 보세요.'}</p><h3>문법과 예제</h3><pre>${esc(t.syntax)}</pre><h3>직접 풀어보기</h3><p>${esc(t.task)}</p><div class="note">${runtimeNote(l)}</div><h3>주의할 오류</h3><p>${l.id==='python'?'들여쓰기와 콜론(:)을 확인하세요. input()의 결과는 문자열입니다.':l.id==='c'?'세미콜론, 형식 지정자, 배열 범위를 확인하세요. 경고 메시지도 읽어보세요.':'괄호와 따옴표 짝을 확인하고 오류 메시지의 위치를 살펴보세요.'}</p><h3>핵심 정리</h3><p>${esc(t.hint)}</p><div class="row"><button onclick="bookmark()">${state.bookmarks.includes(key())?'★ 북마크 해제':'☆ 북마크'}</button><button onclick="complete()">✓ 학습 완료</button><button onclick="nextLesson()">다음 강의 →</button></div>`}</article><section class="card editor"><div class="editorbar"><strong style="margin-right:auto" id="filename">실습.${l.ext}</strong><button onclick="undo()">실행 취소</button><button onclick="redo()">다시 실행</button><button onclick="findCode()">검색</button><button onclick="copyCode()">복사</button><button onclick="downloadCode()">다운로드</button></div><div class="codebox"><div id="numbers" class="numbers" aria-hidden="true"></div><div class="codearea"><pre id="highlight" aria-hidden="true"></pre><textarea id="code" aria-label="코드 편집기" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div></div><div class="actions row"><button id="run" class="primary" onclick="runCode()">▶ 코드 실행</button><button id="stop" onclick="stop()" disabled>■ 중지</button><button onclick="resetCode()">↺ 초기화</button><button onclick="submitCode()">✓ 정답 제출</button><button onclick="hint()">힌트</button><button onclick="persistCode();toast('코드를 저장했습니다')">저장</button></div><div class="console"><label class="tiny" for="stdin">표준 입력 · 한 줄에 하나씩</label><textarea id="stdin" class="stdin" placeholder="10&#10;20">${t.sum?'10\n20':''}</textarea><div id="runstatus" class="status" role="status">실행 준비 · ${runtimeNote(l)}</div><pre id="output" role="log" aria-live="polite">코드를 실행하면 결과가 여기에 표시됩니다.</pre><iframe id="preview" title="웹 코드 실행 미리보기" sandbox="allow-scripts" class="preview hidden"></iframe></div></section></div>`;$('#language').onchange=e=>{stop();state.language=e.target.value;state.lesson=0;activeFile=null;render()};loadCode();if(free)fileList()}
function runtimeNote(l){if(l.id==='javascript')return '오프라인 실행 · 격리된 Worker';if(['html','css'].includes(l.id))return '오프라인 실행 · 샌드박스 미리보기';if(l.id==='python')return '첫 실행 시 인터넷 필요 · Pyodide 다운로드';if(l.id==='sql')return '첫 실행 시 인터넷 필요 · SQLite 다운로드';if(l.id==='typescript')return '첫 실행 시 인터넷 필요 · TypeScript 변환기 다운로드';return '별도 격리 실행 서버 필요 · 설정에서 연결'}
function loadCode(){history=[];future=[];$('#code').value=state.codes[key()]??(free?lang().code:lessons(lang())[state.lesson].syntax);highlight();if(activeFile)$('#filename').textContent=state.files.find(f=>f.id===activeFile)?.name||'파일'}
function persistCode(){if($('#code')){state.codes[key()]=$('#code').value;save()}}
function highlight(){let c=$('#code').value;const pattern=/(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|\b(def|class|return|if|else|elif|for|while|in|import|from|as|try|except|with|int|void|double|char|const|let|var|function|async|await|new|public|static|using|fn|mut|SELECT|FROM|WHERE|AS|CREATE|TABLE|INSERT|INTO|VALUES)\b/g;let out='',last=0;for(const m of c.matchAll(pattern)){out+=esc(c.slice(last,m.index));out+='<span class="'+(m[1]?'comment':m[2]?'str':m[3]?'num':'kw')+'">'+esc(m[0])+'</span>';last=m.index+m[0].length}$('#highlight').innerHTML=out+esc(c.slice(last))+'\n';$('#numbers').textContent=c.split('\n').map((_,i)=>i+1).join('\n');syncScroll()}
function syncScroll(){if(!$('#code'))return;$('#highlight').scrollTop=$('#code').scrollTop;$('#highlight').scrollLeft=$('#code').scrollLeft;$('#numbers').scrollTop=$('#code').scrollTop}
document.addEventListener('input',e=>{if(e.target.id==='code'){history.push(state.codes[key()]??(free?lang().code:lessons(lang())[state.lesson].syntax));if(history.length>100)history.shift();future=[];persistCode();highlight()}});document.addEventListener('scroll',e=>{if(e.target.id==='code')syncScroll()},true);
function edit(text,start,end){const c=$('#code');history.push(c.value);future=[];c.setRangeText(text,start??c.selectionStart,end??c.selectionEnd,'end');persistCode();highlight()}
document.addEventListener('keydown',e=>{if(e.target.id!=='code')return;const c=e.target;if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCode();return}if((e.ctrlKey||e.metaKey)&&e.key===' '){e.preventDefault();autocomplete();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();findCode();return}if(e.key==='Tab'){e.preventDefault();edit('    ')}else if(e.key==='Enter'){e.preventDefault();const before=c.value.slice(0,c.selectionStart),line=before.split('\n').pop();edit('\n'+(line.match(/^\s*/)?.[0]||'')+(/[{:]\s*$/.test(line)?'    ':''))}else if('({["\''.includes(e.key)){e.preventDefault();const pairs={'(':')','{':'}','[':']','"':'"',"'":"'"},a=c.selectionStart,b=c.selectionEnd;edit(e.key+c.value.slice(a,b)+pairs[e.key],a,b);c.selectionStart=c.selectionEnd=a+1}});
function undo(){if(!history.length)return;future.push($('#code').value);$('#code').value=history.pop();persistCode();highlight()}function redo(){if(!future.length)return;history.push($('#code').value);$('#code').value=future.pop();persistCode();highlight()}

function saveGoal(){const n=Number($('#goal').value);if(!Number.isInteger(n)||n<1||n>1440){toast('1~1440 사이 정수를 입력하세요');return}state.goal=n;save();toast('목표를 저장했습니다')}
function saveServer(){try{const v=$('#server').value.trim();if(v){const u=new URL(v);if(u.protocol!=='https:'||u.username||u.password)throw Error()}state.server=v;save();toast('실행 서버 설정을 저장했습니다')}catch{toast('인증 정보가 없는 HTTPS URL을 입력하세요.')}}
$('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const x=JSON.parse(await file.text());if(x.version!==1||!languages.some(l=>l.id===x.language)||!Number.isInteger(x.lesson)||x.lesson<0||x.lesson>6||!Array.isArray(x.done)||!Array.isArray(x.bookmarks)||!Array.isArray(x.attempts)||!Array.isArray(x.files)||typeof x.codes!=='object'||x.codes===null||Array.isArray(x.codes)||Object.values(x.codes).some(v=>typeof v!=='string')||x.files.some(f=>typeof f.id!=='string'||typeof f.name!=='string'||!languages.some(l=>l.id===f.language))||x.attempts.some(a=>typeof a.key!=='string'||typeof a.ok!=='boolean'||isNaN(Date.parse(a.date)))||[...x.done,...x.bookmarks].some(k=>!/^\w+:[0-6]$/.test(k)))throw Error();window.pendingImport=x;modal('<h2>기록을 가져올까요?</h2><p>현재 기록을 교체합니다. 필요한 경우 먼저 내보내 주세요.</p><button onclick="applyImport()">교체하여 가져오기</button>')}catch{toast('올바른 CodeMaster 백업 파일이 아닙니다.')}e.target.value=''};
function applyImport(){state={...defaults(),...window.pendingImport,server:state.server};state.seconds=Math.max(0,Number(state.seconds)||0);state.goal=Math.min(1440,Math.max(1,Number(state.goal)||20));delete window.pendingImport;save();$('#modal').close();render();toast('학습 기록을 가져왔습니다')}
$('#search').onkeydown=e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;const hits=[];for(const l of languages)for(const [i,t] of lessons(l).entries())if((l.name+' '+t.title+' '+t.body).toLowerCase().includes(q))hits.push(`<button onclick="$('#modal').close();start('${l.id}',${i})">${l.name} · ${esc(t.title)}</button>`);modal('<h2>검색 결과</h2><div class="search-results">'+(hits.join('')||'<p>일치하는 강의가 없습니다.</p>')+'</div>')};
setInterval(()=>{if(!document.hidden&&['learning','lab'].includes(page)){state.seconds+=10;save()}},10000);
render();
</script></html>
